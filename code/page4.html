<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Futuristic Homepage</title>

  <!-- p5.js Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/addons/p5.sound.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: linear-gradient(45deg, #0a0a0a, #111, #1e1e1e);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      font-size: 18px;
    }

    /* Button Styling */
    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background: linear-gradient(45deg, #ffcc00, #ffaa00);
      color: #111;
      font-size: 18px;
      font-weight: bold;
      padding: 12px 30px;
      border: none;
      cursor: pointer;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(255, 204, 0, 0.4);
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .back-button:hover {
      background: linear-gradient(45deg, #ffaa00, #ffcc00);
      box-shadow: 0 8px 40px rgba(255, 204, 0, 0.8);
      transform: scale(1.05);
    }

    .back-button:focus {
      outline: none;
    }

    /* Centering canvas container */
    #sketch-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%); /* Center the canvas */
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      animation: fadeIn 2s ease-in-out;
    }

    /* Canvas fade-in effect */
    @keyframes fadeIn {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Glowing Text (optional) */
    .futuristic-text {
      font-size: 48px;
      font-weight: bold;
      text-transform: uppercase;
      animation: pulse 1.5s infinite alternate;
      text-shadow: 0 0 10px #ffcc00, 0 0 30px #ffaa00, 0 0 60px #ffcc00;
    }

    /* Pulse Animation */
    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
        text-shadow: 0 0 20px #ffcc00, 0 0 50px #ffaa00, 0 0 100px #ffcc00;
      }
      100% {
        transform: scale(1);
      }
    }

    /* Instruction Text Styling */
    .instruction-text {
      position: absolute;
      top: 250px;
      text-align: center;
      font-size: 22px;
      color: #ffcc00;
      text-shadow: 0 0 10px #ffaa00, 0 0 20px #ffcc00;
      width: 80%;
    }
  </style>
</head>
<body>

  
  <!-- Container for p5.js sketch -->
  <div id="sketch-container"></div>

  <!-- Instructional Text -->
  <div class="instruction-text">
    BONUS!!! 
    Use the arrow keys (Up, Down, Left, Right) to move the cursor and catch some fishes for your sushi! 🍙🍣🍱🥢
  </div>

  <!-- Load sketch4.js -->
  <script src="sketch4.js"></script>

  <!-- Button to go back to the homepage -->
  <button class="back-button" onclick="window.location.href='index.html'">Back to Homepage</button>


</body>
</html>
